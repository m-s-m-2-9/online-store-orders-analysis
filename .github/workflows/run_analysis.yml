name: Execute Store Analytics
on: [push]
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Analysis Script
        run: python analysis.py

      - name: Save Generated Business Report
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Business-Report
          path: business_report.txt
